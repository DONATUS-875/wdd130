
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting Company for trip information, reservations, questions, and customer support.">
    <meta name="author" content="Ahule Tertindi Donatus">
    <title>Contact Us | White Water Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/rafting-logo.png" alt="White Water Rafting logo">
        <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            
                <div class="company-info">
                        <p>
                            <strong>Address:</strong><br>
                            123 Main River Street <br>
                            Kolob, California 84741
                        </p>
                       
                    
        
                    <p>
                        <strong>Phone:</strong><br>
                        (974) 345-2567
                    </p>
        
                    <p>
                        <strong>Email</strong><br>
                        info@whitewater.com
                    </p>
                </div>
                
                <div class="contact-container">
                    <div class="map-placeholder">
                        <div class="pin"></div>
                    </div>
                    
                    <div class="contact-form">
                        <form action="#" method="post">
                            <label for="fullname">Name</label>
                            <input type="text" id="fullname" name="fullname" required>
                    
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                    
                            <fieldset>
                                <legend>Message Purpose</legend>
                    
                                <label>
                                    <input type="radio" id="general" name="purpose" value="general" checked>
                                    General Inquiry
                                </label>
                    
                                <label>
                                    <input type="radio" id="reservation" name="purpose" value="reservation">
                                    Reservation Questions
                                </label>
                    
                                <label>
                                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                                    Website Suggestion
                                </label>
                            </fieldset>
                    
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                    
                            <div class="newsletter">
                                <input type="checkbox" id="newsletter" name="newsletter">
                                <label for="newsletter">
                                    Please subscribe me to the monthly newsletter
                                </label>
                            </div>
                    
                            <button type="submit">Send My Message</button>
                        </form>
                    </div>
                    </div>
                </div>
                    
        </section>
        
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-gallery">
                <figure>
                    <img src="images/manager.jpg" alt="John Smith, General Manager">
                    <figcaption>John Smith - General Manager</figcaption>
                </figure>
                
                <figure>
                    <img src="images/guide.jpg" alt="Sarah Johnson, Lead River Guide">
                    <figcaption>Sarah Johnson, Lead River Guide</figcaption>
                </figure>
                
                <figure>
                    <img src="images/coordinator.jpg" alt="Micheal Davis, Reservation Coordinator">
                    <figcaption>Micheal Davis - Reservation Coordinator</figcaption>
                </figure>
            </div>
        </section>
        
    </main>
    <footer>
            <p>&copy; 2026 White Water Rafting Company | Ahule Tertindi Donatus</p>
            <nav class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.svg" alt="Facebook Icon">
                </a>
                <a href="https://linkedin.com">
                    <img src="images/linkedin.svg" alt="LinkedIn Icon">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.svg" alt="Instagram Icon">
                </a>
            </nav>
    </footer>
</body>
</html>
